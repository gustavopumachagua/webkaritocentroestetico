    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:locale" content="%KARITO_SEO_OG_LOCALE%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%KARITO_CANONICAL_URL%" />
    <meta property="og:site_name" content="%KARITO_SEO_SITE_NAME%" />
    <meta
      property="og:title"
      content="%KARITO_SEO_TITLE%"
    />
    <meta
      property="og:description"
      content="%KARITO_SEO_DESCRIPTION%"
    />
    <meta
      property="og:image"
      content="%KARITO_OG_IMAGE_URL%"
    />
    <meta
      property="og:image:secure_url"
      content="%KARITO_OG_IMAGE_URL%"
    />
    <meta property="og:image:type" content="%KARITO_SEO_IMAGE_TYPE%" />

      property="og:image:alt"
      content="%KARITO_SEO_IMAGE_ALT%"
    />
    <meta property="og:image:width" content="%KARITO_SEO_IMAGE_WIDTH%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%KARITO_CANONICAL_URL%" />
    <meta
      name="twitter:title"
      content="%KARITO_SEO_TITLE%"
    />
    <meta
      name="twitter:description"
      content="%KARITO_SEO_DESCRIPTION%"
    />
    <meta
      name="twitter:image"
      content="%KARITO_OG_IMAGE_URL%"
    />
    <meta
      name="twitter:image:alt"
      content="%KARITO_SEO_IMAGE_ALT%"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        background: #05070a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top left,
            rgba(207, 155, 114, 0.18),
            transparent 28%
          ),
          radial-gradient(
            circle at 82% 12%,
            rgba(114, 141, 175, 0.1),
            transparent 20%
          ),
          radial-gradient(
            circle at center right,
            rgba(155, 102, 71, 0.12),
            transparent 22%
          ),
          linear-gradient(180deg, #05070a 0%, #091019 42%, #0b131c 100%);
        color: #f6efe8;
      }

      #root {
        min-height: 100vh;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at top left,
            rgba(207, 155, 114, 0.18),
            transparent 28%
          ),
          radial-gradient(
            circle at 82% 12%,
            rgba(114, 141, 175, 0.1),
            transparent 20%
          ),
          radial-gradient(
            circle at center right,
            rgba(155, 102, 71, 0.12),
            transparent 22%
          ),
          linear-gradient(180deg, #05070a 0%, #091019 42%, #0b131c 100%);
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      body.app-ready #boot-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader__shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }

      .boot-loader__mark {
        display: grid;
        place-items: center;
        width: 104px;
        height: 104px;
        padding: 12px;
        border-radius: 28px;
        border: 1px solid rgba(242, 231, 219, 0.1);
        background: rgba(12, 18, 27, 0.82);
        box-shadow:
          0 18px 48px rgba(0, 0, 0, 0.32),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
      }

      .boot-loader__mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 22px;
      }

      .boot-loader__spinner {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: 3px solid rgba(242, 231, 219, 0.12);
        border-top-color: #cf9b72;
        animation: boot-spin 0.9s linear infinite;
      }

      .boot-loader__label {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 1.5rem;
        line-height: 1;
        letter-spacing: 0.01em;
        color: #f2ceb0;
      }

      .boot-loader__label::before {
        content: attr(data-es);
      }

      html[lang="en"] .boot-loader__label::before {
        content: attr(data-en);
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-loader__shell">
        <div class="boot-loader__mark">
          <img src="/apple-touch-icon.png" alt="" />
        </div>
        <div class="boot-loader__spinner"></div>
        <p
          class="boot-loader__label"
          data-es="Karito Centro Estético"
          data-en="Karito Aesthetic Center"
        ></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
